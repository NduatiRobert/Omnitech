# Rebuilds the live site every morning so articles with a future date
# go live on their publish day without anyone touching the server.
# Needs two GitHub repository secrets (Settings > Secrets and variables > Actions):
#   COOLIFY_WEBHOOK  - the Deploy Webhook URL from your Coolify app (Webhooks tab)
#   COOLIFY_TOKEN    - a Coolify API token with "deploy" permission (Keys & Tokens > API tokens)
name: Daily rebuild
on:
  schedule:
    - cron: "17 3 * * *"   # 06:17 East Africa Time
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ] || [ -z "$TOKEN" ]; then echo "Coolify secrets not set - skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $TOKEN" "$WEBHOOK"
