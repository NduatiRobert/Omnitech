server {
    listen 80;
    listen 3000;  # Coolify's default port, so routing works whichever port is set
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Clean URLs: /cctv-installation also serves cctv-installation.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Long cache for CSS, JS, images and fonts
    location ~* \.(css|js|png|jpg|jpeg|webp|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Pages, sitemap and feed: always fresh so new articles show immediately
    location ~* \.(html|xml|txt)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
